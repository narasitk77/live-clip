# Local end-to-end test: fake S3 (moto) + a fake vMix (ffmpeg test pattern over SRT).
services:
  s3:
    image: motoserver/moto:latest
  publisher:
    image: bluenviron/mediamtx:1.21.2-ffmpeg
    profiles: [pub]
    entrypoint: ["ffmpeg"]
    command: >-
      -hide_banner -loglevel warning -re
      -f lavfi -i testsrc=size=1280x720:rate=30
      -f lavfi -i sine=frequency=1000:sample_rate=48000
      -c:v libx264 -preset veryfast -b:v 4M -g 60 -keyint_min 60 -sc_threshold 0 -pix_fmt yuv420p
      -c:a aac -b:a 128k
      -f mpegts srt://mediamtx:8890?streamid=publish:${PUB_NAME:-cam1}&passphrase=${PUB_PASS}&pbkeylen=16&latency=1000000

# Docker Desktop picked 172.20.0.0/16 for this network, which overlaps the office LAN
# (172.20.48.0/21) and can misroute replies to encoders on the LAN. Pin a range nobody uses.
networks:
  default:
    ipam:
      config:
        - subnet: 10.231.0.0/24
