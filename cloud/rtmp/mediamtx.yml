# MediaMTX for live-clip on the CLOUD VM: SRT (UDP 8890) and RTMP (TCP 1935) in, nothing else exposed.
# Full replacement for mediamtx/mediamtx.yml, mounted by docker-compose.rtmp.yml at /config.
#
# DO NOT EDIT THIS FILE WHILE A STAGE IS LIVE. MediaMTX reloads it on save: a broken file makes
# MediaMTX exit (restart: always then loops until it is fixed, both stages down), and any change
# under pathDefaults restarts every live path (a 2-5 s hole in each buffer). If you must, edit a
# copy, check it with: docker compose exec mediamtx /mediamtx --validate-conf=/config/<copy>
# and only then move it over this file.
#
# Every encoder needs a user + password, and each user may publish to ONE path only.
# RTMP has no passphrase, so without these users anyone on the internet could publish (and,
# with overridePublisher, kick a live stage off). SRT still needs the passphrase on top.
# Exception: relay-wirecast listens on UDP 8891 with the passphrase alone and publishes with its
# own user, so anyone holding the passphrase can feed wirecast1. That is why docker-compose.rtmp.yml
# leaves the relay off unless COMPOSE_PROFILES=wirecast-srt is set.
# One key = one encoder on air: two encoders on the same key (a backup, or RTMP and SRT at once)
# keep kicking each other off (measured 11 times in 40 s). Give a backup its own user and path.
# Lock encoders to H.264 + AAC: Enhanced RTMP accepts HEVC/AV1, which the SRT read-back cannot
# carry, so the buffer silently ends up without picture while the page says "receiving".
#
# Passwords come from env (docker-compose.rtmp.yml, MTX_AUTHINTERNALUSERS_<i>_PASS). The values
# below are SHA-256 of a random value that was thrown away: if an env override is missing, nobody
# can log in as that user (fails closed). An EMPTY pass would accept any password.
# Passwords: a-z0-9 only, 24+ chars (':' breaks the SRT streamid, '&' '=' '+' '#' break the RTMP URL).
#
# Keep index 1 and 2 where they are: the base compose file sets MTX_AUTHINTERNALUSERS_2_PASS
# for the web app's API user, and dvr.sh depends on index 1.
logLevel: info
# Never set udpReadBufferSize above the host's net.core.rmem_max (212992 on Docker Desktop and
# most NAS kernels): MediaMTX then refuses to open the SRT listener at all (reproduced 26 Oct).

rtsp: no
hls: no
webrtc: no
playback: no
metrics: no
pprof: no
moq: no

# SRT stays on even for an RTMP-only event: dvr.sh reads every stream back over SRT on
# 127.0.0.1:8890 and relay-wirecast publishes over SRT. "RTMP only" = do not publish UDP 8890.
srt: yes
srtAddress: :8890

# Plain RTMP: the stream key (with ?user=..&pass=..) crosses the venue network unencrypted.
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"
# RTMPS (encoders that accept rtmps://<PUBLIC_HOST>:1936/...): set "optional" here and enable the
# RTMPS lines in docker-compose.rtmp.yml (cert/key paths come from env there). Do this only after
# Caddy has obtained its certificate: MediaMTX refuses to start while the files are missing.
# rtmpEncryption: "optional"
# rtmpsAddress: :1936

# Control API: reachable only on the docker network (port 9997 is never published).
api: yes
apiAddress: :9997

authMethod: internal
authInternalUsers:
  # 0: main stage (outside team). RTMP: server rtmp://<host>:1935, key main?user=main&pass=<MAIN_PUBLISH_PASS>
  #    SRT: streamid publish:main:main:<MAIN_PUBLISH_PASS> plus the SRT passphrase.
  - user: main
    pass: sha256:0Ca3zq07I1NDFiKCFY5rfzq+fdaBwuepnpyDSXwDxP4=
    ips: []
    permissions:
      - action: publish
        path: main
  # 1: dvr.sh runs inside this container and reads every stream back over SRT. Do not move.
  - user: any
    pass:
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: read
  # 2: the web app. docker-compose.cloud.yml sets this password from MEDIAMTX_API_PASS through
  #    MTX_AUTHINTERNALUSERS_2_PASS. Do not move.
  - user: liveclip
    pass: sha256:0Ca3zq07I1NDFiKCFY5rfzq+fdaBwuepnpyDSXwDxP4=
    ips: []
    permissions:
      - action: api
  # 3: expertise stage (our OBS). RTMP key expertise?user=expertise&pass=<EXPERTISE_PUBLISH_PASS>
  #    SRT: streamid publish:expertise:expertise:<EXPERTISE_PUBLISH_PASS> plus the SRT passphrase.
  - user: expertise
    pass: sha256:0Ca3zq07I1NDFiKCFY5rfzq+fdaBwuepnpyDSXwDxP4=
    ips: []
    permissions:
      - action: publish
        path: expertise
  # 4: relay-wirecast (Wirecast SRT on UDP 8891 -> here). Path follows WIRECAST_NAME via env.
  #    Never handed to anyone outside the VM.
  - user: relay
    pass: sha256:0Ca3zq07I1NDFiKCFY5rfzq+fdaBwuepnpyDSXwDxP4=
    ips: []
    permissions:
      - action: publish
        path: wirecast1

pathDefaults:
  srtPublishPassphrase:
  # Started when a stream becomes available, stopped with SIGINT when it goes away.
  runOnAvailable: /dvr.sh
  runOnAvailableRestart: yes
  # A new publisher with the right credentials replaces the current one at once. With "no", an
  # encoder whose 4G/TCP link died is refused ("someone is already publishing") until readTimeout
  # (10 s) drops the dead connection, and its retry backoff stretches the gap further.
  # Only holders of that path's password can do this, so the stranger case is already closed.
  overridePublisher: yes

paths:
  # Stream names become folder names: lowercase letters, digits, - and _ only.
  '~^[a-z0-9_-]{1,32}$':
